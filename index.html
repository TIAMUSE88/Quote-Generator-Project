<!DOCTYPE html>
<html>

<head>
    <title>AI Quote Generator</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/style-quote.css" />
</head>

<body>
    <h1>💬 AI Quote Generator</h1>
    <div class="quote-container">
        <small class="question">what's your vibe?..</small>

        <select class="mood-select">
            <option value=" motivational">motivational</option>
            <option value="love">love</option>
            <option value="success">success</option>
            <option value="life">life</option>
            <option value="happiness">happiness</option>
            <option value="funny">funny</option>
            <option value="wisdom">wisdom</option>
            <option value="friendship">friendship</option>
            <option value="inspirational">inspirational</option>
            <option value="money">money</option>
        </select>

        <button class="generate">generate your quote.</button>

    </div>
    <div class="final-quote"></div>

                target="_blank">Tracey-Marie💗</a></em>. Her work is on <a

            href="#" target=" _blank">Netlify.</a></footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="src/index-quote.js"></script>

</html>
